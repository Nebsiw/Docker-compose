---
services:
  zulip_database:
    image: "zulip/zulip-postgresql:14"
    restart: unless-stopped
    secrets:
      - zulip__postgres_password
    environment:
      POSTGRES_DB: "zulip"
      POSTGRES_USER: "zulip"
      POSTGRES_PASSWORD_FILE: /run/secrets/zulip__postgres_password
    volumes:
      - "zulip_postgresql-14:/var/lib/postgresql/data:rw"
#    attach: false
    networks: 
      shared_network_04:
        ipv4_address: 172.103.0.151
  zulip_memcached:
    image: "memcached:alpine"
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - |
        echo 'mech_list: plain' > "$$SASL_CONF_PATH"
        echo "zulip@$$HOSTNAME:$$(cat $$MEMCACHED_PASSWORD_FILE)" > "$$MEMCACHED_SASL_PWDB"
        echo "zulip@localhost:$$(cat $$MEMCACHED_PASSWORD_FILE)" >> "$$MEMCACHED_SASL_PWDB"
        exec memcached -S
    secrets:
      - zulip__memcached_password
    environment:
      SASL_CONF_PATH: "/home/memcache/memcached.conf"
      MEMCACHED_SASL_PWDB: "/home/memcache/memcached-sasl-db"
      MEMCACHED_PASSWORD_FILE: /run/secrets/zulip__memcached_password
#    attach: false
    networks: 
      shared_network_04:
        ipv4_address: 172.103.0.152
  zulip_rabbitmq:
    image: "rabbitmq:4.2"
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - |
        export RABBITMQ_DEFAULT_PASS="$$(cat $$RABBITMQ_PASSWORD_FILE)"
        echo 'default_user = $$(RABBITMQ_DEFAULT_USER)' >> /etc/rabbitmq/rabbitmq.conf
        echo 'default_pass = $$(RABBITMQ_DEFAULT_PASS)' >> /etc/rabbitmq/rabbitmq.conf
        exec docker-entrypoint.sh rabbitmq-server
    secrets:
      - zulip__rabbitmq_password
    environment:
      RABBITMQ_DEFAULT_USER: "zulip"
      RABBITMQ_PASSWORD_FILE: /run/secrets/zulip__rabbitmq_password
    volumes:
      - "zulip_rabbitmq:/var/lib/rabbitmq:rw"
#    attach: false
    networks: 
      shared_network_04:
        ipv4_address: 172.103.0.153
  zulip_redis:
    image: "redis:alpine"
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - '/usr/local/bin/docker-entrypoint.sh --requirepass "$$(cat $$REDIS_PASSWORD_FILE)"'
    secrets:
      - zulip__redis_password
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/zulip__redis_password
    volumes:
      - "zulip_redis:/data:rw"
#    attach: false
    networks: 
      shared_network_04:
        ipv4_address: 172.103.0.154
  zulip:
    image: "ghcr.io/zulip/zulip-server:12.3-0"
    restart: unless-stopped
    ports:
#      - name: smtp
#        target: 25
#        published: 1525
#        app_protocol: smtp
      - name: http
        target: 80
        published: 1580
        app_protocol: http
#      - name: https
#        target: 443
#        published: 15443
#        app_protocol: https
    secrets:
      - zulip__postgres_password
      - zulip__memcached_password
      - zulip__rabbitmq_password
      - zulip__redis_password
      - zulip__secret_key
      - zulip__email_password
    environment:
      # Default hostnames; configure your application in compose.override.yaml
      SETTING_REMOTE_POSTGRES_HOST: "zulip_database"
      SETTING_MEMCACHED_LOCATION: "zulip_memcached:11211"
      SETTING_RABBITMQ_HOST: "zulip_rabbitmq"
      SETTING_REDIS_HOST: "zulip_redis"
    volumes:
      - "zulip_data:/data:rw"
    ulimits:
      nofile:
        soft: 1000000
        hard: 1048576
    depends_on:
      - zulip_database
      - zulip_memcached
      - zulip_rabbitmq
      - zulip_redis
    networks: 
      shared_network_04:
        ipv4_address: 172.103.0.155

volumes:
  zulip_data:
    external: true
  zulip_postgresql-14:
    external: true
  zulip_rabbitmq:
    external: true
  zulip_redis:
    external: true

networks:
  shared_network_04:
    external: true
