services:
  mattermost:
    image: mattermost/mattermost-team-edition:${MM_TAG}
    container_name: mattermost
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ}
      MM_SQLSETTINGS_DRIVERNAME: ${MM_SQLSETTINGS_DRIVERNAME}
      MM_SQLSETTINGS_DATASOURCE: ${MM_SQLSETTINGS_DATASOURCE}
      MM_BLEVESETTINGS_INDEXDIR: ${MM_BLEVESETTINGS_INDEXDIR}
      MM_SERVICESETTINGS_SITEURL: ${MM_SERVICESETTINGS_SITEURL}
    volumes:
      - mattermost_config:/mattermost/config
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
      - mattermost_plugins:/mattermost/plugins
      - mattermost_client:/mattermost/client
      - mattermost_bleve-indexes:/mattermost/bleve-indexes
    ports:
      - "8065:8065"
      #Calls VCS
#      - "8443:8443/udp"
#      - "8443:8443/tcp"
    networks: 
      shared_network_04:
        ipv4_address: 172.103.0.100

networks:
  shared_network_04:
    external: true
volumes:
  mattermost_config:
    external: true
  mattermost_data:
   external: true
  mattermost_logs:
   external: true
  mattermost_plugins:
   external: true
  mattermost_client:
   external: true
  mattermost_bleve-indexes:
   external: true