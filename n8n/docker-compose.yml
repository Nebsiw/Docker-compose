services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      - GENERIC_TIMEZONE=${TZ:-}
      - TZ=${TZ:-}
      - NODE_ENV=${NODE_ENV:-production}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - N8N_RUNNERS_ENABLED=${N8N_RUNNERS_ENABLED:-true}
      - N8N_RUNNERS_MODE=${N8N_RUNNERS_MODE:-external}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=${N8N_RUNNERS_BROKER_LISTEN_ADDRESS:-0.0.0.0}
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_NATIVE_PYTHON_RUNNER=${N8N_NATIVE_PYTHON_RUNNER:-true}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - N8N_HOST=${N8N_HOST:-}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
      - DB_SQLITE_POOL_SIZE=${DB_SQLITE_POOL_SIZE:-100}
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=${N8N_GIT_NODE_DISABLE_BARE_REPOS:-true}
      - N8N_DIAGNOSTICS_ENABLED=${N8N_DIAGNOSTICS_ENABLED:-false}
      - N8N_DIAGNOSTICS_CONFIG_FRONTEND=${N8N_DIAGNOSTICS_CONFIG_FRONTEND:-}
      - N8N_DIAGNOSTICS_CONFIG_BACKEND=${N8N_DIAGNOSTICS_CONFIG_BACKEND:-}
      - EXTERNAL_FRONTEND_HOOKS_URLS=${EXTERNAL_FRONTEND_HOOKS_URLS:-}
      - N8N_TRUST_PROXY=${N8N_TRUST_PROXY:-}
      - N8N_PROXY_HOPS=${N8N_PROXY_HOPS:-}
      - N8N_LICENSE_ACTIVATION_KEY=${N8N_LICENSE_ACTIVATION_KEY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - https_proxy_license_server=${HTTPS_PROXY_LICENSE_SERVER:-}
      - N8N_LOG_OUTPUT=${N8N_LOG_OUTPUT:-}
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      - NODE_USE_SYSTEM_CA=${NODE_USE_SYSTEM_CA:-1}
    volumes:
      - n8n_data:/home/node/.n8n
      - /etc/ssl/certs:/etc/ssl/certs:ro
    networks:
      one:
        ipv4_address: 172.27.0.22

  task-runner:
    image: n8nio/runners:latest
    container_name: n8n-task-runner
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
    networks:
      one:
        ipv4_address: 172.27.0.26

networks:
  one:
    external: true

volumes:
  n8n_data:
    external: true