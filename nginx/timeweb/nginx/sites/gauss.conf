limit_req_zone  $binary_remote_addr zone=gsv_files:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=gsv_conn:10m;

map $request_method $effective_secure_link {
    PUT     1;
    default $secure_link;
}

upstream s3_backend {
    server 192.168.11.194:9000;
    keepalive 256; # Сохраняет до 256 готовых открытых соединений к S3
    keepalive_requests 100000;
    keepalive_timeout 60s;
}

upstream api_backend {
    server 192.168.11.194:8000;
    # До 128 открытых idle-соединений на worker-процесс nginx
    keepalive 128;
    keepalive_requests 100000;
    keepalive_timeout 60s;
}

server {

    listen 80;
    listen [::]:80;
    server_name gauss.metasoftpro.ru;
    #Secret
#    include /var/www/gauss/.env/secret;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        }
    location / {
        return 301 https://$host$request_uri;
        }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gauss.metasoftpro.ru;

    client_max_body_size 0;

    # SSL
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_protocols TLSv1.2;
    ssl_certificate /etc/letsencrypt/live/gauss.metasoftpro.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gauss.metasoftpro.ru/privkey.pem; # managed by Certbot

    #Secret
    include /var/www/gauss/.env/secret;

    #Maintenance
    location /maintenance.json {
        alias /var/www/gauss/maintenance/status/maintenance.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        }

    location = /_maintenance.html {
        alias /var/www/gauss/maintenance/status/maintenance.html;
#       internal;
        add_header Retry-After 120 always;
        }
    #Frontend
    location / {
    root /var/www/gauss/gsv;
    index index.html;
    try_files $uri $uri/ /index.html;
    }

    #Share links
    location /s/ {
        root /var/www/gauss/gsv;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    location /api/ {
        client_max_body_size 10m;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        #Error
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /_maintenance.html;

    }
        #S3 Storage
    location ~ ^/gsv-models/(?<model_id>[0-9a-f-]+)/ {
        secure_link $arg_token,$arg_expires;
        secure_link_md5 "$secret$model_id$secure_link_expires";

        if ($effective_secure_link = "") {
            return 403;
        }
        if ($effective_secure_link = "0") {
            return 403;
        }

        limit_req zone=gsv_files burst=200 nodelay;
        limit_req_status 429;
        limit_req_dry_run on;
        limit_conn gsv_conn 60;
        limit_conn_status 429;
        limit_conn_dry_run on;

        proxy_pass http://s3_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
#        proxy_set_header Host 192.168.11.194:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        proxy_buffering off;
        proxy_request_buffering off;

        #Error
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /_maintenance.html;

}

        #Moskino
    location /moskino/ {
        alias /var/www/gauss/moskino/;
        index index.html;
        try_files $uri $uri/ /moskino/index.html;
    }



    error_log /var/log/nginx/gauss_error.log;
    access_log /var/log/nginx/gauss_access.log;
}
