server {

    listen 80;
    listen [::]:80;
    server_name gauss-view.metasoftpro.ru;
    location / {
        return 301 https://$host$request_uri;
        }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gauss-view.metasoftpro.ru;


    #Frontend
    location / {
    root /var/www/gauss-view;
    index index.html;
    try_files $uri $uri/ /index.html;
    }

    error_log /var/log/nginx/gauss-view_error.log;
    access_log /var/log/nginx/gauss-view_access.log;
}
