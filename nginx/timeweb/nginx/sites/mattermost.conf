map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    if ($host = mattermost.metasoftpro.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name mattermost.metasoftpro.ru;
    return 301 https://$host$request_uri;


}

server {
    listen 443 ssl http2;
    server_name mattermost.metasoftpro.ru;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    location ~ /api/v[0-9]+/(users/)?websocket$ {
        proxy_pass http://msp-vm-docker-04:8065;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://msp-vm-docker-04:8065;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    ssl_certificate /etc/letsencrypt/live/mattermost.metasoftpro.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mattermost.metasoftpro.ru/privkey.pem; # managed by Certbot
}
