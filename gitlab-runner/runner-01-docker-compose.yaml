services:
  gitlab-runner_01:
    container_name: gitlab-runner_01
    image: gitlab/gitlab-runner:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gitlab_runner:/etc/gitlab-runner
    networks:
      - shared_network_02
volumes:
    gitlab_runner:
      external: true

networks:
  shared_network_02:
    external: true
    name: shared_network_02